<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Tool Name - Free & HD - text2tool</title>
    <meta name="description" content="Professional SEO description here.">
    
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../tool-style.css">
    <script src="../../js/favicon.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700&display=swap" rel="stylesheet">

    <style>
        :root { 
            /* AI GUIDE: Keep these colors same for YouTube Category Consistency */
            --brand-accent: #D902EE; 
            --accent-rgb: 217, 2, 238;
        }

        /* Essential Animations & Layout */
        .shining-title { font-size: clamp(22px, 5vw, 32px); font-weight: 800; color: var(--brand-accent); text-transform: uppercase; animation: glow 3s infinite ease-in-out; display: inline-block; }
        @keyframes glow { 0%, 100% { text-shadow: 0 0 5px rgba(var(--accent-rgb), 0.2); } 50% { text-shadow: 0 0 20px rgba(var(--accent-rgb), 0.4); } }
        .shining-line { border: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--brand-accent), transparent); width: 150px; margin: 20px auto; }

        /* Dashboard Box Styling */
        .input-container { background: var(--bg-secondary); padding: 2rem; border-radius: 24px; border: 1px solid rgba(var(--accent-rgb), 0.15); margin-bottom: 2.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        .input-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .url-field { flex: 1; min-width: 250px; padding: 16px; border: 2px solid rgba(var(--accent-rgb), 0.2); border-radius: 14px; background: var(--bg-primary); color: inherit; font-size: 16px; outline: none; transition: 0.3s; }
        .url-field:focus { border-color: var(--brand-accent); box-shadow: 0 0 15px rgba(var(--accent-rgb), 0.1); }
        .action-btn { background: var(--brand-accent); color: white; border: none; padding: 16px 32px; border-radius: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
        .action-btn:hover { transform: translateY(-2px); opacity: 0.9; }

        /* History Styling */
        .history-box { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(var(--accent-rgb), 0.1); display: none; text-align: left; }
        .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; margin-top: 12px; }
        .history-item { cursor: pointer; border-radius: 8px; overflow: hidden; border: 2px solid transparent; transition: 0.3s; aspect-ratio: 16/9; background: #000; }
        .history-item:hover { border-color: var(--brand-accent); transform: translateY(-3px); }
        .history-item img { width: 100%; height: 100%; object-fit: cover; }

        /* SEO & Feature Styling */
        .feature-item { padding: 20px; transition: 0.3s; }
        .feature-item:hover { transform: translateY(-5px); }
        .faq-item { background: var(--bg-secondary); border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(var(--accent-rgb), 0.1); text-align: left; }
        .faq-question { padding: 15px 20px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>

<body class="color-youtube"> 
    <header></header> 
    
    <main class="tool-container">
        
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <div class="upload-icon" style="margin-bottom: 1rem;">
                <i class="fa-brands fa-youtube" style="font-size: 64px; color: var(--brand-accent);"></i>
            </div>
            <h1 class="shining-title">TOOL_NAME_HERE</h1>
            <p style="font-size: 20px; font-weight: 700; margin-top: 5px; opacity: 0.9;">(Free, No Login, Unlimited)</p>
            <div class="shining-line"></div>
        </div>

        <div class="input-container">
            <div class="input-group">
                <input type="text" id="toolInput" class="url-field" placeholder="Enter content here..." spellcheck="false">
                <button class="action-btn" onclick="mainFunction()">
                    <i data-lucide="zap"></i> Process Now
                </button>
            </div>

            <div id="displayZone" style="display:none; margin: 2rem 0; padding-top: 2rem; border-top: 1px dashed rgba(var(--accent-rgb), 0.3);">
                </div>

            <div id="historySection" class="history-box">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-weight: 700; font-size: 14px; opacity: 0.8;">Recent Activity</span>
                    <button onclick="clearHistory()" style="background:none; border:none; color:var(--brand-accent); cursor:pointer; font-size:12px;">Clear</button>
                </div>
                <div id="historyGrid" class="history-grid"></div>
            </div>
        </div>

        <div style="max-width: 800px; margin: 0 auto 3rem auto; text-align: center;">
            <p style="font-size: 18px; line-height: 1.7; opacity: 0.85; font-weight: 500;">
                SHORT_SEO_INTRO_DESCRIPTION_HERE
            </p>
        </div>

        <div class="section-divider" style="max-width: 900px; margin: 40px auto; text-align: center;">
            
            <h2 style="color: var(--brand-accent); margin-bottom: 40px;">Features</h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 60px;">
                <div class="feature-item">
                    <div style="font-size: 40px; margin-bottom: 10px;">✅</div>
                    <strong>Feature 1</strong>
                </div>
                </div>

            <h2 style="color: var(--brand-accent); margin-bottom: 30px;">FAQ</h2>
            <div class="faq-container">
                <div class="faq-item">
                    <div class="faq-question">Question 1? <i data-lucide="chevron-down"></i></div>
                    <div class="faq-answer" style="padding: 0 20px 15px; display: none; opacity: 0.8;">Answer 1.</div>
                </div>
            </div>

            <div style="margin-top: 50px; background: rgba(var(--accent-rgb), 0.05); padding: 25px; border-radius: 20px; text-align: left; border-left: 4px solid var(--brand-accent);">
                <h3 style="color: var(--brand-accent); margin-bottom: 10px;">⚖️ Disclaimer</h3>
                <p style="font-size: 14px; opacity: 0.8;">
                    DISCLAIMER_TEXT_HERE
                    <span id="dots">...</span><span id="moreText" style="display: none;"> FULL_DISCLAIMER_HERE </span>
                </p>
                <button onclick="toggleDisclaimer()" id="readMoreBtn" style="background:none; border:none; color:var(--brand-accent); font-weight:700; cursor:pointer;">Read More</button>
            </div>
        </div>

        <div id="relatedBlogs"></div>
    </main>

    <footer></footer> 

    <script src="../../js/tools-data.js"></script>
    <script src="../../js/blogs-data.js"></script>
    <script src="../../js/script.js"></script>

    <script>
        lucide.createIcons();
        
        // AI GUIDE: Add specific Tool Logic here
        function mainFunction() {
            // Your Core Logic
        }

        // Standard Disclaimer Toggle
        function toggleDisclaimer() {
            const dots = document.getElementById("dots");
            const moreText = document.getElementById("moreText");
            const btnText = document.getElementById("readMoreBtn");
            if (dots.style.display === "none") {
                dots.style.display = "inline"; btnText.innerHTML = "Read More"; moreText.style.display = "none";
            } else {
                dots.style.display = "none"; btnText.innerHTML = "Read Less"; moreText.style.display = "inline";
            }
        }

        // Standard FAQ Toggle
        document.querySelectorAll('.faq-question').forEach(q => {
            q.addEventListener('click', () => {
                const answer = q.nextElementSibling;
                const isVisible = answer.style.display === 'block';
                document.querySelectorAll('.faq-answer').forEach(a => a.style.display = 'none');
                answer.style.display = isVisible ? 'none' : 'block';
            });
        });

        renderRelatedBlogs('TOOL_ID_HERE');
    </script>
</body>
</html>
